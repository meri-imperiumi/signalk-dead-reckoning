    cp tools/webapp-screenshot-harness.html public/
    (cd public && python3 -m http.server 8742 &)
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      "$CHROME" --headless=new --disable-gpu --no-sandbox \
        --window-size=1440,900 --hide-scrollbars \
        --virtual-time-budget=20000 --screenshot="$out" \
        "http://127.0.0.1:8742/webapp-screenshot-harness.html?state=$s"

    # a fixed 390x844 iframe at a window Chrome won't clamp, then CROP
    # (never resample: aspect-safe):
    # (the iframe is CENTERED in the wrapper because sips
    # --cropToHeightWidth crops around the image center)
    cat > public/shot-wrapper.html <<'WRAP'
    <!DOCTYPE html><html><head><meta charset="utf-8"><title>wrapper</title>
    <style>html,body{margin:0;height:100%;background:#000}body{display:flex;align-items:center;justify-content:center}iframe{border:0;display:block;width:390px;height:844px}</style>
    </head><body><iframe src="./webapp-screenshot-harness.html?state=map"></iframe></body></html>

    "$CHROME" --headless=new --disable-gpu --no-sandbox \
      --window-size=600,900 --hide-scrollbars \
      --virtual-time-budget=30000 --screenshot=/tmp/dr-wrap.png \
      "http://127.0.0.1:8742/shot-wrapper.html"
    sips --cropToHeightWidth 844 390 /tmp/dr-wrap.png --out doc/dr-mobile.png

<script type="module">
  import "./dr-app.js";
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  window.addEventListener("load", async () => {
    await sleep(500);
    const S = window.__SCENARIO;
    const app = document.querySelector("dr-app");
    const sr = app.shadowRoot;
    const mapView = sr.querySelector("#dr-map");
    const map = mapView.map;

    // Live stream: DR + GPS + engine state + current + AIS, stamped
    // with the sail's own timestamps so the chartwork labels match.
    const ts = S.timestampNow;
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.position", { latitude: S.live.dr[0], longitude: S.live.dr[1], timestamp: ts });
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.position", { latitude: S.live.gps[0], longitude: S.live.gps[1], timestamp: ts });
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.state", { status: "underway" });
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.log", S.live.log);
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.method", S.live.method);
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.uncertainty", S.live.uncertainty);
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.divergence", S.live.divergence);
    window.__pushDelta("vessels.urn:mrn:test:self", "navigation.deadReckoning.elapsedSinceFix", S.live.elapsedSinceFix);
    window.__pushDelta("vessels.urn:mrn:test:self", "environment.current.setTrue", S.live.current.setTrue * Math.PI / 180);
    window.__pushDelta("vessels.urn:mrn:test:self", "environment.current.drift", S.live.current.drift / 1.944);
    for (const a of S.aisDeltas) {
      window.__pushDelta(a.ctx, "navigation.position", { latitude: a.lat, longitude: a.lon, timestamp: ts });
      window.__pushDelta(a.ctx, "navigation.courseOverGroundTrue", a.cog * Math.PI / 180);
      window.__pushDelta(a.ctx, "navigation.speedOverGround", a.sog / 1.944);
    }
    await sleep(400);
    mapView.recenter();
    map.setZoom(11);
    await sleep(1200); // tiles

    const state = new URLSearchParams(location.search).get("state") ?? "map";
    if (state === "celestial") {
      sr.querySelector("#btn-sight").click();
      await sleep(100);
      const panel = sr.querySelector("#dr-sight");
      panel.autoClose = () => {}; // keep the result readable
      panel.shadowRoot.querySelector('[data-tab="celestial"]').click();
      await sleep(100);
      const form = panel.shadowRoot.querySelector("#form-celestial");
      form.querySelector('[name="body"]').value = "Sun";
      form.querySelector('[name="hs_deg"]').value = "41.2";
      form.querySelector('[name="eye_height_m"]').value = "2.2";
      form.querySelector('[data-submit="celestial"]').click();
      await sleep(600);
    }
    if (state === "mobile") {
      // Phone portrait: pending drawer open as a bottom sheet above
      // the readout band. Wait for the pending list to load first —
      // clicking the toggle before refreshPending() reveals it loses
      // the race (the 0→n transition resets drawerOpen on phones).
      const btn = sr.querySelector("#btn-pending");
      for (let i = 0; i < 30 && btn.hidden; i++) await sleep(100);
      btn.click();
      await sleep(300);
    }
    if (state === "bearing") {
      // Right-click pick at the charted object: context menu over the chart
      const pt = map.latLngToContainerPoint(S.live.pickObject);
      mapView.showPickMenu(S.live.pickObject, { x: pt.x - 10, y: pt.y + 14 }, { label: "Oxhornen light" });
      await sleep(300);
    }

    // probe: sanity report via document.title (shadow DOM isn't serialized)
    const counts = {};
    for (const [name, layer] of Object.entries(mapView.layers)) {
      counts[name] = layer ? layer.getLayers().length : -1;
    }
    const facts = {
      ...counts,
      ghostLen: app.snap.ghostTrack?.length ?? -1,
      gpsLen: app.snap.gpsTrack?.length ?? -1,
      tiles: mapView.shadowRoot.querySelectorAll(".leaflet-tile-loaded").length,
      pickMenu: !!mapView.shadowRoot.querySelector(".dr-pick-menu"),
      dialogOpen: !!sr.querySelector("#sight-dialog")?.open,
      reduction: sr.querySelector("#dr-sight")?.shadowRoot.querySelector("#reduction")?.textContent ?? null,
      bodyOpts: [...(sr.querySelector("#dr-sight")?.shadowRoot.querySelector('#form-celestial [name="body"]')?.options ?? [])].map((o) => o.textContent).join("|"),
      status: sr.querySelector("#dr-sight")?.shadowRoot.querySelector("#status")?.textContent ?? null,
      drawerOpen: app.drawerOpen,
      viewport: `${innerWidth}x${innerHeight}`,
    };
    console.log("facts", JSON.stringify(facts));
    document.title = `layers:${JSON.stringify(facts)}`;
  });
</script>
